<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI WhatsApp Message Improver</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }


        .header {
            text-align: center;
            margin-bottom: 30px;
        }


        .header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }


        .header p {
            color: #666;
            font-size: 17px;
        }


        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }


        .form-group {
            margin-bottom: 22px;
        }


        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }


        textarea {
            width: 100%;
            height: 160px;

            padding: 14px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;

            resize: vertical;
        }


        textarea:focus {
            outline: none;
            border-color: #6c63ff;
        }


        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;

            background: white;
        }


        select:focus {
            outline: none;
            border-color: #6c63ff;
        }


        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #6c63ff;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #554ddf;
        }


        .result {
            margin-top: 30px;

            padding: 25px;

            background: #f8f9ff;

            border-radius: 12px;

            border-left: 5px solid #6c63ff;
        }


        .result h2 {
            margin-top: 0;
        }


        .message-box {
            background: white;

            padding: 18px;

            border-radius: 8px;

            line-height: 1.7;

            font-size: 17px;

            white-space: pre-line;
        }


        .error {
            margin-top: 20px;

            padding: 15px;

            background: #ffe6e6;

            color: #b00020;

            border-radius: 8px;
        }


        .footer {
            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <div class="container">


        <div class="header">

            <h1>💬 AI WhatsApp Message Improver</h1>

            <p>
                Turn simple or poorly written messages
                into clear and professional messages.
            </p>

        </div>


        <div class="card">


            <form method="POST">


                <!-- Message -->

                <div class="form-group">

                    <label for="message">
                        Enter Your WhatsApp Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Example: tomorrow class 10 am all students come compulsory"
                        required
                    ></textarea>

                </div>


                <!-- Style -->

                <div class="form-group">

                    <label for="style">
                        Select Message Style
                    </label>

                    <select id="style" name="style">

                        <option value="Professional">
                            Professional
                        </option>

                        <option value="Friendly">
                            Friendly
                        </option>

                        <option value="Formal">
                            Formal
                        </option>

                        <option value="Short and Simple">
                            Short and Simple
                        </option>

                    </select>

                </div>


                <!-- Button -->

                <button type="submit">

                    ✨ Improve Message

                </button>


            </form>


            <!-- Error -->

            {% if error %}

                <div class="error">

                    <strong>Error:</strong>
                    {{ error }}

                </div>

            {% endif %}


            <!-- Result -->

            {% if improved_message %}

                <div class="result">

                    <h2>
                        ✨ Improved Message
                    </h2>

                    <div class="message-box">

                        {{ improved_message }}

                    </div>

                </div>

            {% endif %}


        </div>


        <div class="footer">

            AI WhatsApp Message Improver | Powered by Gemini

        </div>


    </div>


</body>

</html>
